<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Minesweeper</title>
  <link rel="stylesheet" href="https://unpkg.com">
  <style>
    body {
      background: #ece9d8;
      font-family: Tahoma, Geneva, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }

    .window {
      width: auto;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ece9d8;
      border: 2px inset #fff;
      padding: 4px 8px;
      margin-bottom: 10px;
    }

    .counter {
      background: black;
      color: red;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 20px;
      padding: 2px 6px;
      border: 1px inset #777;
      min-width: 40px;
      text-align: center;
    }

    .face-btn {
      font-size: 18px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 25px);
      grid-template-rows: repeat(9, 25px);
      gap: 1px;
      background: #808080;
      border: 3px inset #fff;
      padding: 2px;
    }

    .cell {
      width: 25px;
      height: 25px;
      background: #ccc;
      border: 2px outset #fff;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .cell.revealed {
      background: #ddd;
      border: 1px solid #999;
    }

    .cell.mine {
      background: red !important;
    }

    .n-1 { color: blue; }
    .n-2 { color: green; }
    .n-3 { color: red; }
    .n-4 { color: darkblue; }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Minesweeper</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    
    <div class="window-body">
      <div class="status-bar">
        <div class="counter" id="mine-count">10</div>
        <button class="face-btn" id="reset-btn" onclick="initGame()">🙂</button>
        <div class="counter" id="timer">000</div>
      </div>

      <div class="grid" id="board"></div>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES_COUNT = 10;

    let board = [];
    let gameOver = false;
    let revealedCount = 0;
    let timerInterval = null;
    let timeElapsed = 0;
    let firstClick = true;

    function initGame() {
      clearInterval(timerInterval);
      timerInterval = null;
      timeElapsed = 0;
      firstClick = true;
      document.getElementById('timer').textContent = '000';

      gameOver = false;
      revealedCount = 0;
      document.getElementById('reset-btn').textContent = '🙂';
      document.getElementById('mine-count').textContent = MINES_COUNT;
      
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';
      
      board = Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
        isMine: false,
        isRevealed: false,
        isFlagged: false,
        neighborMines: 0,
        element: null
      })));

      let minesPlaced = 0;
      while (minesPlaced < MINES_COUNT) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if (!board[r][c].isMine) {
          board[r][c].isMine = true;
          minesPlaced++;
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            board[r][c].neighborMines = countNeighbors(r, c);
          }
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cellElement = document.createElement('div');
          cellElement.classList.add('cell');
          
          cellElement.addEventListener('click', () => revealCell(r, c));
          cellElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          board[r][c].element = cellElement;
          boardElement.appendChild(cellElement);
        }
      }
    }

    function countNeighbors(r, c) {
      let count = 0;
      for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
          if (board[r + i] && board[r + i][c + j] && board[r + i][c + j].isMine) {
            count++;
          }
        }
      }
      return count;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeElapsed++;
        if (timeElapsed <= 999) {
          document.getElementById('timer').textContent = timeElapsed.toString().padStart(3, '0');
        }
      }, 1000);
    }

    function revealCell(r, c) {
      if (gameOver || board[r][c].isRevealed || board[r][c].isFlagged) return;

      if (firstClick) {
        firstClick = false;
        startTimer();
      }

      const cell = board[r][c];
      cell.isRevealed = true;
      cell.element.classList.add('revealed');
      revealedCount++;

      if (cell.isMine) {
        endGame(false, r, c);
        return;
      }

      if (cell.neighborMines > 0) {
        cell.element.textContent = cell.neighborMines;
        cell.element.classList.add(`n-${cell.neighborMines}`);
      } else {
        for (let i = -1; i <= 1; i++) {
          for (let j = -1; j <= 1; j++) {
            if (board[r + i] && board[r + i][c + j]) {
              revealCell(r + i, c + j);
            }
          }
        }
      }

      if (revealedCount === (ROWS * COLS) - MINES_COUNT) {
        endGame(true);
      }
    }

    function toggleFlag(r, c) {
      if (gameOver || board[r][c].isRevealed) return;
      const cell = board[r][c];
      const counter = document.getElementById('mine-count');
      let currentMines = parseInt(counter.textContent);

      if (!cell.isFlagged) {
        cell.isFlagged = true;
        cell.element.textContent = '🚩';
        counter.textContent = currentMines - 1;
      } else {
        cell.isFlagged = false;
        cell.element.textContent = '';
        counter.textContent = currentMines + 1;
      }
    }

    function endGame(isWin, targetR, targetC) {
      gameOver = true;
      clearInterval(timerInterval);
      document.getElementById('reset-btn').textContent = isWin ? '😎' : '😵';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) {
            board[r][c].element.textContent = '💣';
            if (!isWin && r === targetR && c === targetC) {
              board[r][c].element.classList.add('mine');
            }
          }
        }
      }
      if (isWin) alert('You win!');
    }

    initGame();
  </script>
</body>
</html>
